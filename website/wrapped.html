<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wrapped · ClaudeRank</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="stylesheet" href="css/style.css">
    <script>if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');</script>
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="ClaudeRank">
    <meta property="twitter:card" content="summary_large_image">
    <meta id="ogTitle" property="og:title" content="Claude Rank Wrapped">
    <meta id="twTitle" property="twitter:title" content="Claude Rank Wrapped">
    <meta id="ogDesc" property="og:description" content="Monthly recap of Claude Code usage.">
    <meta id="twDesc" property="twitter:description" content="Monthly recap of Claude Code usage.">
    <meta id="ogImage" property="og:image" content="">
    <meta id="twImage" property="twitter:image" content="">
    <style>
        /* ╔═══════════════════════════════════════════════════╗
           Cinematic Wrapped — local tokens
           Page-scoped overrides; do not affect rest of site.
           ╚═══════════════════════════════════════════════════╝ */
        :root {
            --accent-deep: #c2521e;
            --bg-page-end: #f0ece4;
            --shadow-card: 0 4px 14px rgba(0,0,0,0.06);
            --shadow-pop: 0 18px 50px rgba(0,0,0,0.18);
        }

        body.wrapped {
            margin: 0; padding: 0;
            font-family: 'SF Mono', 'Menlo', 'Consolas', 'Liberation Mono', 'Courier New', monospace;
            overflow-x: hidden;
            background: #0e0e0e;
            color: var(--text-primary);
            min-height: 100vh;
        }
        html.wrapped-html { scroll-snap-type: y proximity; scroll-behavior: smooth; }
        body.wrapped a { text-decoration: none; }

        /* Parallax — composes with .r-up's `translate` property */
        [data-parallax] {
            transform: translate3d(0, var(--py, 0px), 0);
            will-change: transform;
        }

        /* progress rail (fixed) */
        .rail {
            position: fixed; right: 22px; top: 50%; transform: translateY(-50%);
            z-index: 50; display: flex; flex-direction: column; gap: 10px;
        }
        .rail .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: rgba(255,255,255,0.30);
            border: 1px solid rgba(255,255,255,0.50);
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .rail .dot[data-light="dark"] {
            background: rgba(0,0,0,0.18);
            border-color: rgba(0,0,0,0.4);
        }
        .rail .dot.active { transform: scale(1.7); background: var(--accent); border-color: var(--accent); }

        /* Top brand badge */
        .brandbadge {
            position: fixed; top: 22px; left: 24px; z-index: 50;
            display: flex; align-items: center; gap: 10px;
            color: #fff; font-weight: 700; letter-spacing: 2px; font-size: 11px;
            text-transform: uppercase;
            mix-blend-mode: difference;
        }
        .brandbadge img { width: 18px; height: 18px; filter: invert(1); }
        .pageno {
            position: fixed; top: 22px; right: 60px; z-index: 50;
            color: #fff; font-weight: 700; letter-spacing: 2px; font-size: 11px;
            mix-blend-mode: difference;
        }

        /* Section base */
        section.chap {
            height: 100vh; height: 100svh; min-height: 600px;
            width: 100vw;
            scroll-snap-align: start;
            display: flex; align-items: center; justify-content: center;
            position: relative;
            overflow: hidden;
            padding: 0 6vw;
        }
        section.chap .inner { width: 100%; max-width: 1200px; position: relative; z-index: 2; }

        /* Eyebrow text */
        .eb {
            font-size: 12px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase;
            color: var(--text-secondary);
            display: inline-flex; align-items: center; gap: 10px;
            margin-bottom: 18px;
        }
        .eb::before {
            content: ""; width: 28px; height: 1px; background: currentColor;
        }
        section.chap[data-theme="dark"] .eb { color: #999; }
        section.chap[data-theme="hot"] .eb { color: rgba(255,255,255,0.7); }

        /* Headline */
        .hl {
            font-size: clamp(48px, 7vw, 96px);
            font-weight: 800; line-height: 0.96; letter-spacing: -2px;
            margin: 0 0 22px;
            text-wrap: balance;
            color: var(--text-primary);
        }
        .hl .accent { color: var(--accent); }
        section.chap[data-theme="dark"] .hl { color: #fff; }
        section.chap[data-theme="hot"] .hl { color: #fff; }

        /* Sub copy */
        .sub {
            font-size: 17px; font-weight: 500; max-width: 600px;
            line-height: 1.55; color: var(--text-secondary);
        }
        section.chap[data-theme="dark"] .sub { color: #aaa; }
        section.chap[data-theme="hot"] .sub { color: rgba(255,255,255,0.78); }

        /* Mega numeral */
        .mega {
            font-size: clamp(140px, 28vw, 420px);
            font-weight: 800;
            letter-spacing: -10px;
            line-height: 0.82;
            font-variant-numeric: tabular-nums;
            color: var(--text-primary);
            margin: 0;
        }
        section.chap[data-theme="dark"] .mega { color: #fff; }
        section.chap[data-theme="hot"] .mega { color: #fff; }
        .mega .unit {
            font-size: 0.16em; letter-spacing: 4px; vertical-align: super;
            margin-left: 10px;
            color: var(--text-secondary);
            font-weight: 700;
        }
        section.chap[data-theme="dark"] .mega .unit { color: #888; }
        section.chap[data-theme="hot"] .mega .unit { color: rgba(255,255,255,0.6); }

        /* ╔═══ CHAPTER 0 · COVER ═══╗ */
        #c0 { background: linear-gradient(180deg, #fff 0%, var(--bg-page-end) 100%); }
        #c0 .cover-eyebrow {
            font-size: 12px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase;
            color: var(--text-secondary);
            display: flex; align-items: center; gap: 10px;
            justify-content: center;
        }
        #c0 .cover-eyebrow::before, #c0 .cover-eyebrow::after {
            content: ""; flex: 1; max-width: 80px; height: 1px; background: var(--text-secondary);
        }
        #c0 .title {
            font-size: clamp(80px, 18vw, 280px);
            font-weight: 800; letter-spacing: -8px;
            line-height: 0.85;
            margin: 24px 0;
            text-align: center;
            color: var(--text-primary);
        }
        #c0 .title .yr { color: var(--accent); }
        #c0 .meta {
            display: flex; gap: 28px; justify-content: center; flex-wrap: wrap;
            font-size: 13px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
            color: var(--text-secondary);
            margin-top: 20px;
        }
        #c0 .meta b { color: var(--text-primary); }
        #c0 .scroll-cue {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: var(--text-secondary); font-size: 18px; font-weight: 700;
            letter-spacing: 4px; text-transform: uppercase;
            display: flex; flex-direction: column; align-items: center; gap: 14px;
        }
        #c0 .scroll-cue .arr { animation: bob 1.6s ease-in-out infinite; font-size: 32px; line-height: 1; }
        @keyframes bob {
            0%,100% { transform: translateY(0); } 50% { transform: translateY(6px); }
        }
        #c0 .echo {
            position: absolute; left: 0; right: 0; top: 50%;
            transform: translateY(-50%);
            font-size: clamp(80px, 18vw, 280px);
            font-weight: 800; letter-spacing: -8px;
            line-height: 0.85;
            text-align: center;
            pointer-events: none;
            color: var(--accent);
            opacity: 0.05;
            will-change: transform;
        }
        #c0 .echo.e1 { color: #111; }

        /* ╔═══ CHAPTER 1 · MESSAGES ═══╗ */
        #c1 { background: var(--bg-page-end); }
        #c1 .row { display: grid; grid-template-columns: 1.2fr 1fr; gap: 60px; align-items: center; }
        @media (max-width: 800px) { #c1 .row { grid-template-columns: 1fr; gap: 30px; } }
        #c1 .megaCount {
            font-size: clamp(120px, 22vw, 320px);
            font-weight: 800; letter-spacing: -8px; line-height: 0.85;
            font-variant-numeric: tabular-nums;
            color: var(--text-primary);
        }
        #c1 .delta {
            display: inline-flex; align-items: baseline; gap: 8px;
            padding: 10px 18px; border-radius: 8px;
            background: #fff; box-shadow: var(--shadow-card);
            font-size: 18px; font-weight: 800; color: var(--green);
            margin-top: 24px;
        }
        #c1 .delta.down { color: var(--red); }
        #c1 .delta .ago { color: var(--text-secondary); font-weight: 600; font-size: 13px; margin-left: 6px; letter-spacing: 1px; text-transform: uppercase; }

        /* ╔═══ CHAPTER 2 · TOKENS (HOT) ═══╗ */
        #c2 { background: linear-gradient(160deg, var(--accent) 0%, var(--accent-deep) 100%); color: #fff; }
        #c2 .glow {
            position: absolute; inset: -50%;
            background: radial-gradient(circle at 30% 50%, rgba(255,255,255,0.20), transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(255,255,255,0.12), transparent 45%);
            pointer-events: none;
        }
        #c2 .layout { display: grid; grid-template-columns: 1.4fr 1fr; gap: 60px; align-items: center; }
        @media (max-width: 800px) { #c2 .layout { grid-template-columns: 1fr; } }
        #c2 .megaCount {
            font-size: clamp(120px, 24vw, 360px);
            font-weight: 800; letter-spacing: -10px; line-height: 0.85;
            font-variant-numeric: tabular-nums;
            color: #fff;
        }
        #c2 .megaCount .unit { font-size: 0.17em; opacity: 0.7; letter-spacing: 4px; margin-left: 8px; }
        #c2 .receipt {
            background: rgba(0,0,0,0.18);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 14px; padding: 22px;
            font-size: 13px; line-height: 1.85;
            backdrop-filter: blur(4px);
        }
        #c2 .receipt .ln {
            display: grid; grid-template-columns: 1fr auto; gap: 14px;
            border-bottom: 1px dashed rgba(255,255,255,0.18);
            padding: 6px 0;
        }
        #c2 .receipt .ln:last-child { border: none; padding-top: 10px; font-weight: 800; }
        #c2 .receipt .ln .l { color: rgba(255,255,255,0.85); }
        #c2 .receipt .ln .r { font-variant-numeric: tabular-nums; }
        #c2 .receipt .head { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.6); margin-bottom: 10px; }

        /* ╔═══ CHAPTER 3 · VS LAST MONTH ═══╗ */
        #c3 { background: var(--bg-page-end); }
        #c3 .split { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; }
        @media (max-width: 800px) { #c3 .split { grid-template-columns: 1fr; } }
        #c3 .card {
            background: #fff; border-radius: 18px;
            padding: 28px 30px; box-shadow: var(--shadow-card);
            border: 1px solid var(--border);
        }
        #c3 .card.prev { opacity: 0.55; }
        #c3 .card h3 { margin: 0 0 4px; font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--text-secondary); }
        #c3 .card .month { font-size: 28px; font-weight: 800; letter-spacing: -1px; margin: 0 0 24px; color: var(--text-primary); }
        #c3 .card .month.now { color: var(--accent); }
        #c3 .stat-line {
            display: grid; grid-template-columns: 110px 1fr 90px;
            gap: 14px; align-items: center;
            padding: 10px 0;
            border-top: 1px solid var(--border);
            font-size: 13px;
        }
        #c3 .stat-line:first-of-type { border-top: none; }
        #c3 .stat-line .lab { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-secondary); }
        #c3 .stat-line .v { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--text-primary); }
        #c3 .stat-line .ring {
            height: 6px; background: var(--bg-card); border-radius: 999px; overflow: hidden;
        }
        #c3 .stat-line .ring i {
            display: block; height: 100%; background: var(--accent); border-radius: 999px;
            width: 0; transition: width 1.4s cubic-bezier(0.2, 0.7, 0.2, 1);
        }
        #c3 .card.prev .stat-line .ring i { background: var(--text-secondary); }

        /* ╔═══ CHAPTER 4 · HEATMAP (DARK) ═══╗ */
        #c4 { background: #0e0e0e; color: #fff; }
        #c4 .hm-grid { display: grid; grid-template-columns: 1fr 1.4fr; gap: 60px; align-items: center; }
        @media (max-width: 1000px) { #c4 .hm-grid { grid-template-columns: 1fr; } }
        #c4 .map-card {
            background: #1a1a1a; border-radius: 18px; padding: 22px 24px;
            border: 1px solid #2a2a2a;
        }
        #c4 .map-card .head {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 14px;
            font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #888;
        }
        #c4 .map-card .legend { display: flex; align-items: center; gap: 8px; }
        #c4 .map-card .legend .g { width: 80px; height: 10px; border-radius: 3px; background: linear-gradient(to right, #4a3322, var(--accent-deep)); }
        #c4 .cell { transition: opacity 0.5s ease, transform 0.5s ease; transform-origin: center; transform-box: fill-box; }
        #c4 .cell.empty { fill: #232323; opacity: 0.8; }
        #c4 .cell.q1 { fill: #5a3220; }
        #c4 .cell.q2 { fill: #8a4422; }
        #c4 .cell.q3 { fill: #c25620; }
        #c4 .cell.q4 { fill: var(--accent-deep); }
        #c4 .cell.reveal-pending { opacity: 0; transform: scale(0.4); }
        #c4 .cell.peak { stroke: #fff; stroke-width: 1.5px; }
        #c4 .peak-tag {
            display: inline-block; padding: 6px 12px;
            background: var(--accent); color: #fff;
            border-radius: 6px; font-size: 11px; font-weight: 700; letter-spacing: 2px;
        }

        /* ╔═══ CHAPTER 5 · BUSIEST DAY ═══╗ */
        #c5 { background: var(--bg-page-end); }
        #c5 .grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 50px; align-items: center; }
        @media (max-width: 900px) { #c5 .grid { grid-template-columns: 1fr; } }
        #c5 .dayMega {
            font-size: clamp(140px, 22vw, 300px);
            font-weight: 800; letter-spacing: -10px; line-height: 0.85;
            font-variant-numeric: tabular-nums;
            color: var(--text-primary);
            margin-top: 20px;
        }
        #c5 .dayMega .accent { color: var(--accent); }
        #c5 .ticket {
            background: #fff; border-radius: 16px; padding: 26px 28px;
            box-shadow: var(--shadow-card); border: 1px solid var(--border);
            position: relative; overflow: hidden;
        }
        #c5 .ticket::before, #c5 .ticket::after {
            content: ""; position: absolute; width: 24px; height: 24px;
            background: var(--bg-page-end);
            border-radius: 50%; left: 50%; transform: translateX(-50%);
        }
        #c5 .ticket::before { top: -12px; }
        #c5 .ticket::after  { bottom: -12px; }
        #c5 .ticket .d {
            font-size: 14px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 4px;
        }
        #c5 .ticket .dt {
            font-size: 56px; font-weight: 800; letter-spacing: -2px; line-height: 1;
            color: var(--text-primary); margin-bottom: 18px;
        }
        #c5 .ticket .dt .day { color: var(--accent); }
        #c5 .ticket hr { border: none; border-top: 1px dashed var(--border); margin: 18px 0; }
        #c5 .ticket .trow {
            display: grid; grid-template-columns: 1fr auto;
            gap: 14px; padding: 6px 0;
            font-size: 13px;
        }
        #c5 .ticket .trow .l { color: var(--text-secondary); font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; font-size: 11px; }
        #c5 .ticket .trow .r { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--text-primary); }
        #c5 .ticket .trow .r.hot { color: var(--accent); }

        /* ╔═══ CHAPTER 6 · CONCURRENCY (DARK) ═══╗ */
        #c6 { background: #111; color: #fff; }
        #c6 .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; }
        @media (max-width: 900px) { #c6 .layout { grid-template-columns: 1fr; } }
        #c6 .megaRow {
            display: flex; align-items: baseline; gap: 16px;
            margin: 8px 0 16px;
            color: #fff;
            font-weight: 800; font-variant-numeric: tabular-nums;
        }
        #c6 .megaRow .n { font-size: clamp(160px, 28vw, 380px); letter-spacing: -10px; line-height: 0.85; }
        #c6 .megaRow .x { font-size: 80px; color: var(--accent); letter-spacing: -3px; }
        #c6 .agents {
            display: flex; flex-direction: column; gap: 8px;
        }
        #c6 .agents .agent {
            display: grid; grid-template-columns: 50px 1fr auto;
            gap: 14px; align-items: center;
            background: #1a1a1a; border: 1px solid #2a2a2a;
            border-radius: 10px; padding: 12px 16px;
            font-size: 12px;
            opacity: 0; transform: translateX(-20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        #c6 .agents .agent.in { opacity: 1; transform: translateX(0); }
        #c6 .agents .agent .id { color: var(--accent); font-weight: 800; letter-spacing: 1px; }
        #c6 .agents .agent .task { color: #ddd; font-weight: 500; }
        #c6 .agents .agent .task b { color: #fff; font-weight: 700; }
        #c6 .agents .agent .dur { color: #888; font-weight: 700; font-variant-numeric: tabular-nums; }

        /* ╔═══ CHAPTER 7 · SHARE ═══╗ */
        #c8 { background: var(--bg-page-end); }
        #c8 .layout { display: grid; grid-template-columns: 1.1fr 1fr; gap: 60px; align-items: center; }
        @media (max-width: 900px) { #c8 .layout { grid-template-columns: 1fr; } }
        #c8 .share-card {
            background: #fff; color: var(--text-primary); border-radius: 20px; padding: 0;
            box-shadow: var(--shadow-pop);
            border: 1px solid var(--border);
            transform: perspective(1200px) rotateY(-4deg) rotateX(2deg);
            transition: transform 0.5s ease;
            position: relative; overflow: hidden;
        }
        #c8 .share-card:hover { transform: perspective(1200px) rotateY(0) rotateX(0); }
        #c8 .share-card img.og { display: block; width: 100%; height: auto; }

        #c8 .actions { display: flex; flex-direction: column; gap: 12px; }
        #c8 .actions button, #c8 .actions a {
            border: 1px solid var(--border); background: #fff; color: var(--text-primary);
            border-radius: 10px; padding: 16px 20px;
            text-align: left; font-family: inherit; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
            transition: all 150ms ease;
            text-decoration: none;
        }
        #c8 .actions button:hover, #c8 .actions a:hover { transform: translateY(-2px); box-shadow: var(--shadow-card); border-color: #b0a89e; }
        #c8 .actions .l { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
        #c8 .actions .r { color: var(--text-secondary); font-size: 16px; }
        #c8 .actions button.primary { background: #111; color: #fff; border-color: #111; }
        #c8 .actions button.primary .r { color: #fff; }
        #c8 .actions .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #111; color: #fff;
            padding: 10px 18px; border-radius: 8px;
            font-size: 11px; letter-spacing: 2px; text-transform: uppercase; font-weight: 700;
            opacity: 0; transition: opacity 0.2s;
            pointer-events: none; z-index: 60;
        }
        #c8 .actions .toast.show { opacity: 1; }

        /* ── Reveal classes ─────────────────────────────────── */
        /* Use the `translate` property so it composes with `transform` parallax. */
        .r-up   { opacity: 0; translate: 0 40px;  transition: opacity 0.9s ease, translate 0.9s cubic-bezier(0.2,0.7,0.2,1); }
        .r-left { opacity: 0; translate: -30px 0; transition: opacity 0.9s ease, translate 0.9s cubic-bezier(0.2,0.7,0.2,1); }
        .r-up.in, .r-left.in { opacity: 1; translate: 0 0; }
        .d1 { transition-delay: 0.10s; }
        .d2 { transition-delay: 0.22s; }
        .d3 { transition-delay: 0.34s; }
        .d4 { transition-delay: 0.46s; }
        .d5 { transition-delay: 0.58s; }

        /* Empty / error state */
        .empty-state {
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center; padding: 40px 24px;
            background: linear-gradient(180deg, #fff 0%, var(--bg-page-end) 100%);
        }
        .empty-state .eb { color: var(--text-secondary); }
        .empty-state h2 {
            font-size: clamp(32px, 5vw, 56px); font-weight: 800; letter-spacing: -1px;
            color: var(--text-primary); margin: 12px 0 8px;
        }
        .empty-state p { color: var(--text-secondary); font-size: 15px; margin-bottom: 24px; }
        .empty-state .month-nav { display: flex; gap: 18px; }
        .empty-state .month-nav a {
            color: var(--text-secondary);
            padding: 8px 14px; border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 11px; letter-spacing: 2px; text-transform: uppercase; font-weight: 700;
        }
        .empty-state .month-nav a:hover { background: #fff; color: var(--text-primary); }
    </style>
</head>
<body class="wrapped">
    <div id="wrappedRoot">
        <div class="empty-state"><h2>Loading wrapped…</h2></div>
    </div>

    <script type="module">
        import { getUserByUsername, getUserWrapped, formatNumber, formatCost } from './js/api.js?v=3';

        const $ = (id) => document.getElementById(id);
        const esc = (s) => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; };

        const MONTH_ABBR = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
        const DOW_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const DOW_FULL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        function fmtHour(h) {
            if (h === 0) return '12am';
            if (h < 12) return h + 'am';
            if (h === 12) return '12pm';
            return (h - 12) + 'pm';
        }

        const params = new URLSearchParams(window.location.search);
        const username = params.get('username');
        const userHashParam = params.get('hash');
        let ym = params.get('month');

        if (!ym) {
            const now = new Date();
            const prev = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() - 1, 1));
            ym = `${prev.getUTCFullYear()}-${String(prev.getUTCMonth() + 1).padStart(2, '0')}`;
        }

        async function init() {
            if (!username && !userHashParam) {
                renderError("No user specified — append ?username=YOUR_NAME");
                return;
            }
            try {
                let hash = userHashParam;
                if (!hash) {
                    const u = await getUserByUsername(username);
                    hash = u.user_hash;
                }
                const summary = await getUserWrapped(hash, ym);
                renderWrapped(summary);
            } catch (e) {
                console.error(e);
                renderError(String(e?.message ?? e));
            }
        }

        function renderError(msg) {
            $('wrappedRoot').innerHTML = `<div class="empty-state"><h2>Couldn't load wrapped</h2><p>${esc(msg)}</p></div>`;
        }

        function adjacentMonth(ym, delta) {
            const [y, m] = ym.split('-').map(Number);
            const d = new Date(Date.UTC(y, m - 1 + delta, 1));
            return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}`;
        }

        function deriveYearTag(s) {
            // "MAR'26" style
            const m = MONTH_ABBR[s.month.month - 1];
            const yy = String(s.month.year).slice(-2);
            return `${m}'${yy}`;
        }

        function backCalcPrev(curr, pct) {
            if (pct == null) return 0;
            if (pct === -100) return null;
            const denom = 1 + pct / 100;
            if (denom <= 0) return null;
            return curr / denom;
        }

        function deltaPill(pct) {
            if (pct == null) return '';
            const sign = pct >= 0 ? '▲ +' : '▼ ';
            const cls = pct >= 0 ? '' : 'down';
            return `<div class="delta r-up d3 ${cls}">${sign}${Math.abs(pct).toFixed(1)}%<span class="ago">vs prev month</span></div>`;
        }

        function renderWrapped(s) {

            $('ogTitle').setAttribute('content', title);
            $('twTitle').setAttribute('content', title);
            const desc = `${formatNumber(s.totals.messages)} messages · ${formatNumber(s.totals.tokens)} tokens · ${formatCost(s.totals.estimated_spend)} in ${s.month.label}.`;
            $('ogDesc').setAttribute('content', desc);

                    <div class="empty-state">

            const hasDelta = !!s.delta_vs_prev_month;

            // ────────── Chapter 0 · COVER ──────────

            // ────────── Chapter 2 · TOKENS (HOT) ──────────

            // ────────── Chapter 5 · BUSIEST DAY ──────────

            // ────────── Chapter 6 · CONCURRENCY (DARK) ──────────
            let concChap = '';

                const agentRows = Array.from({ length: cf.peak_concurrency }).map((_, i) => `
                    <div class="agent">

                concChap = `

            // ────────── Chapter 7 · SHARE ──────────

            const shareChap = `

            // Assemble — number eyebrows after we know which chapters rendered
            const chapters = [cover, messagesChap, tokensChap, vsChap, heatChap, busyChap, concChap, shareChap].filter(Boolean);
            // Replace eyebrow placeholders with sequential numbers
            let ebIdx = 1;
            const numberedChapters = chapters.map((html) => {
                // cover has no eyebrow placeholder — increment but don't substitute
                // skip cover (index 0)

            });
            // Re-walk in order and substitute. Cover doesn't have a placeholder; the rest have __EBN__ tokens.

            const placeholders = ['__EB1__', '__EB2__', '__EB3__', '__EB4__', '__EB5__', '__EB6__', '__EBLAST__'];
            // The cover doesn't take an eyebrow number. Numbers start at 01 for chapter "Messages".

                <div class="rail" id="rail"></div>
                ${assembled}`;

            // Build heatmap SVG cells from real data

        // ╔═══════════════════════════════════════════════════╗
        // Rail + scrollspy + per-section FX
        // ╚═══════════════════════════════════════════════════╝
        function wireRailAndScrollspy() {
            const rail = $('rail');
            const sections = document.querySelectorAll('section.chap');
            sections.forEach((s) => {
                const d = document.createElement('div');
                d.className = 'dot';
                const t = s.dataset.theme;
                if (t === 'light') d.dataset.light = 'dark';
                d.title = s.dataset.label || '';
                d.addEventListener('click', () => s.scrollIntoView({ behavior: 'smooth' }));
                rail.appendChild(d);
            });

            const dots = rail.querySelectorAll('.dot');

            // Section-level observer — runs once-per-section FX (count-ups, heatmap, etc.)
            // and updates the rail / page counter as sections come into view.
            const sectionIO = new IntersectionObserver((entries) => {
                for (const e of entries) {
                    if (!e.isIntersecting) continue;
                    const i = [...sections].indexOf(e.target);
                    // Active rail dot whenever a section is the most visible (>=0.5)
                    if (e.intersectionRatio >= 0.5) {
                        dots.forEach(d => d.classList.remove('active'));
                        dots[i].classList.add('active');
                        $('pn-cur').textContent = String(i + 1).padStart(2, '0');
                    }
                    // Fire one-shot effects as soon as section pokes into viewport
                    e.target.classList.add('in');
                    runSectionFx(e.target);
                }
            }, { threshold: [0.05, 0.3, 0.5, 0.75] });
            sections.forEach(s => sectionIO.observe(s));

            // Element-level reveal observer — each .r-up/.r-left fades in
            // independently as it enters the viewport, instead of the whole
            // section snapping in at once.
            const revealIO = new IntersectionObserver((entries) => {
                for (const e of entries) {
                    if (e.isIntersecting) {
                        e.target.classList.add('in');
                        revealIO.unobserve(e.target);
                    }
                }
            }, { threshold: 0, rootMargin: '0px 0px -12% 0px' });
            document.querySelectorAll('.r-up, .r-left').forEach(el => revealIO.observe(el));

            // Scroll parallax — both the cover echoes and any [data-parallax] element.
            const e0 = document.querySelector('#c0 .echo.e0');
            const e1 = document.querySelector('#c0 .echo.e1');
            const parallaxEls = document.querySelectorAll('[data-parallax]');
            let ticking = false;
            function update() {
                const y = window.scrollY;
                const vh = window.innerHeight;
                if (e0) e0.style.transform = `translateY(calc(-50% + ${(-y * 0.25).toFixed(1)}px)) translateX(${(y * 0.04).toFixed(1)}px)`;
                if (e1) e1.style.transform = `translateY(calc(-50% + ${(-y * 0.5).toFixed(1)}px)) translateX(${(-y * 0.06).toFixed(1)}px)`;
                for (const el of parallaxEls) {
                    const rect = el.getBoundingClientRect();
                    // Only update when element is near or in viewport
                    if (rect.bottom < -vh || rect.top > vh * 2) continue;
                    const center = rect.top + rect.height / 2;
                    // -1 above viewport, 0 centered, +1 below viewport
                    const t = (center - vh / 2) / vh;
                    const factor = parseFloat(el.dataset.parallax) || 0;
                    // Drift opposite to scroll direction → element "lags" behind, depth feel
                    const py = -t * factor * vh;
                    el.style.setProperty('--py', py.toFixed(1) + 'px');
                }
                ticking = false;
            }
            window.addEventListener('scroll', () => {
                if (!ticking) { ticking = true; requestAnimationFrame(update); }
            }, { passive: true });
            window.addEventListener('resize', () => {
                if (!ticking) { ticking = true; requestAnimationFrame(update); }
            }, { passive: true });
            // Prime parallax + first-section reveals (so cover content shows
            // before any scroll happens).
            update();
        }

        function animateNum(el) {
            if (el.dataset.done) return;
            el.dataset.done = '1';
            const target = parseFloat(el.dataset.c);
            const dp = parseInt(el.dataset.dp || '0', 10);
            const dur = 1500;
            const t0 = performance.now();
            function step(t) {
                const k = Math.min(1, (t - t0) / dur);
                const e = 1 - Math.pow(1 - k, 3);
                const v = target * e;
                el.textContent = dp > 0 ? v.toFixed(dp) : Math.round(v).toLocaleString();
                if (k < 1) requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        }

        function runSectionFx(sec) {
            if (sec.dataset.fxRun) return;
            sec.dataset.fxRun = '1';
            sec.querySelectorAll('.cnt').forEach(animateNum);
            // Bar fills (ch3)
            sec.querySelectorAll('.ring i').forEach((el, i) => {
                setTimeout(() => { el.style.width = (el.dataset.w || 0) + '%'; }, 350 + i * 80);
            });
            if (sec.id === 'c4') revealHeatmap();
            if (sec.id === 'c6') revealAgents();
        }

        function revealHeatmap() {
            const cells = document.querySelectorAll('#heat2 .cell');
            cells.forEach((c, i) => setTimeout(() => c.classList.remove('reveal-pending'), 4 * i + Math.random() * 200));
        }
        function revealAgents() {
            document.querySelectorAll('#agentList .agent').forEach((el, i) => {
                setTimeout(() => el.classList.add('in'), 350 + i * 110);
            });
        }

        // ╔═══════════════════════════════════════════════════╗
        // Heatmap SVG builder — 7 rows × 24 cols
        // ╚═══════════════════════════════════════════════════╝
        function buildHeatmap(grid, powerHour) {
            const svg = document.getElementById('heat2');
            if (!svg) return;
            const DAYS = 7, HOURS = 24;
            const padL = 36, padT = 6, padR = 6, padB = 6;
            const w = 600, h = 200;
            const cellW = (w - padL - padR) / HOURS;
            const cellH = (h - padT - padB) / DAYS;
            const gap = 2;

            // find max across the grid for quartile classing
            let max = 0;
            for (const row of grid) for (const v of row) if (v > max) max = v;

            function cls(v) {
                if (max <= 0 || v <= 0) return 'empty';
                const r = v / max;
                if (r < 0.08) return 'empty';
                if (r < 0.30) return 'q1';
                if (r < 0.55) return 'q2';
                if (r < 0.80) return 'q3';
                return 'q4';
            }

            // Y-axis day labels
            DOW_NAMES.forEach((lbl, i) => {
                const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                t.setAttribute('x', '4');
                t.setAttribute('y', padT + (i + 0.5) * cellH + 3);
                t.setAttribute('fill', '#888');
                t.setAttribute('font-size', '9');
                t.setAttribute('font-weight', '700');
                t.setAttribute('letter-spacing', '1');
                t.textContent = lbl.toUpperCase();
                svg.appendChild(t);
            });

            for (let d = 0; d < DAYS; d++) {
                for (let hr = 0; hr < HOURS; hr++) {
                    const v = grid[d] ? grid[d][hr] || 0 : 0;
                    const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    r.setAttribute('x', padL + hr * cellW + gap / 2);
                    r.setAttribute('y', padT + d * cellH + gap / 2);
                    r.setAttribute('width', cellW - gap);
                    r.setAttribute('height', cellH - gap);
                    r.setAttribute('rx', '2');
                    let klass = 'cell ' + cls(v) + ' reveal-pending';
                    if (powerHour && d === powerHour.dow && hr === powerHour.hour) klass += ' peak';
                    r.setAttribute('class', klass);
                    svg.appendChild(r);
                }
            }
        }

        // ╔═══════════════════════════════════════════════════╗
        // Share actions
        // ╚═══════════════════════════════════════════════════╝
        function wireShareActions(s, ogImg) {
            $('btnDownload')?.addEventListener('click', () => {
                const a = document.createElement('a');
                a.href = ogImg;
                a.download = `claude-rank-wrapped-${s.user.username || s.user.user_hash}-${s.month.ym}.png`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            });

            const shareUrl = `${location.origin}/wrapped?username=${encodeURIComponent(s.user.username || '')}&month=${s.month.ym}`;

            $('btnCopy')?.addEventListener('click', async () => {
                try { await navigator.clipboard.writeText(shareUrl); } catch { /* clipboard may be blocked */ }
                const toast = $('shareToast');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 1600);
            });

            $('btnShareX')?.addEventListener('click', () => {
                const text = `My Claude Code Wrapped for ${s.month.label}: ${(s.totals.tokens / 1e6).toFixed(1)}M tokens, ${formatCost(s.totals.estimated_spend)} burned.`;
                const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(shareUrl)}`;
                window.open(url, '_blank', 'noopener');
            });
        }

        init();
    </script>
</body>
